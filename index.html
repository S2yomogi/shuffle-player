
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yomogi Shuffle Player</title>
<style>
body {
  background: #111;
  color: white;
  font-family: sans-serif;
  text-align: center;
  padding: 30px 15px;
}
#player {
  width: 100%;
  max-width: 640px;
  aspect-ratio: 16 / 9;
  margin: 20px auto;
}
#player iframe {
  width: 100%;
  height: 100%;
}
button {
  padding: 14px 32px;
  border: 0;
  border-radius: 8px;
  background: white;
  color: black;
  font-weight: bold;
  cursor: pointer;
}
button:disabled {
  opacity: 0.4;
}
</style>
</head>
<body>

<h2>🎵 SHUFFLE PLAY</h2>
<div id="player"></div>

<button id="playButton" disabled onclick="startShuffle()">
▶ SHUFFLE PLAY
</button>

<p id="status">YouTubeプレイヤー接続中...</p>

<script>
let player;
let ready = false;
let shuffled = false;

const playlistId =
"PLqPIA3o75lVWnQyR2-Mzywe0MiP1zXmC_";

function onYouTubeIframeAPIReady() {
  player = new YT.Player("player", {
    width: "640",
    height: "360",
    playerVars: {
      playsinline: 1,
      origin: window.location.origin
    },
    events: {
      onReady: function(event) {
        document.getElementById("status").textContent =
          "プレイヤー接続完了！再生リスト読み込み中...";

        event.target.cuePlaylist({
          listType: "playlist",
          list: playlistId,
          index: 0
        });
      },

      onStateChange: function(event) {
        if (event.data === 5 && !shuffled) {
          player.setShuffle(true);
          shuffled = true;
          ready = true;

          document.getElementById("playButton").disabled = false;
          document.getElementById("status").textContent =
            "シャッフル準備完了！再生ボタンを押してね🎵";
        }

        if (event.data === 1) {
          document.getElementById("status").textContent =
            "Now Playing 🎵";
        }
      },

      onError: function(event) {
        const messages = {
          2: "再生リストの指定を確認してね",
          5: "動画の再生に対応していない状態です",
          100: "動画が削除済み、または非公開です",
          101: "この動画は埋め込み再生できません",
          150: "この動画は埋め込み再生できません",
          153: "ブラウザの接続情報を確認できません"
        };

        document.getElementById("status").textContent =
          "エラー " + event.data + "：" +
          (messages[event.data] || "読み込みエラー");
      }
    }
  });
}

function startShuffle() {
  if (ready) {
    player.playVideo();
  }
}
</script>

<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
